{% extends "web/base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <img src="{% static 'web/img/logo.png' %}" alt="IV Spare Parts Company W.L.L." class="login-logo">
      <div class="text-body-secondary mt-3">Sign in to continue</div>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form }}
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
