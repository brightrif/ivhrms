<div class="card shadow-sm border-0">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <span class="fw-medium">Grades</span>
    {% if perms.organization.add_grade %}<a class="btn btn-sm btn-primary" href="{% url 'web:grade_create' %}"><i class="bi bi-plus-lg me-1"></i>Add grade</a>{% endif %}
  </div>
  <div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead class="table-light"><tr><th>Grade</th><th class="text-end">Rank</th><th></th></tr></thead>
    <tbody>
    {% for g in grades %}
      <tr>
        <td class="fw-medium">{{ g.name }}<div><code class="small">{{ g.code }}</code></div></td>
        <td class="text-end">{{ g.rank }}</td>
        <td class="text-end text-nowrap">
          {% if perms.organization.change_grade %}<a class="btn btn-sm btn-outline-primary" href="{% url 'web:grade_edit' g.pk %}">Edit</a>{% endif %}
          {% if perms.organization.delete_grade %}<a class="btn btn-sm btn-outline-danger" href="{% url 'web:grade_delete' g.pk %}">Delete</a>{% endif %}
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="3" class="text-center text-body-secondary py-4">No grades yet.</td></tr>
    {% endfor %}
    </tbody>
  </table></div>
</div>
