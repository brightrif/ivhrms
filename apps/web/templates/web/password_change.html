{% extends "web/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width:480px">
  <div class="card-body p-4">
    <h1 class="h4">Change password</h1>
    {% if request.user.must_change_password %}
      <div class="alert alert-warning">You are using a temporary password. Choose a new one to continue.</div>
    {% endif %}
    <form method="post">{% csrf_token %}{{ form }}<button class="btn btn-primary">Change password</button></form>
  </div>
</div>
{% endblock %}
