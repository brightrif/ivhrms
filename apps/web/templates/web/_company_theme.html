{% if company_theme %}<style id="company-theme">
{% if company_theme.primary %}:root, [data-bs-theme="light"] {
  --iv-blue: {{ company_theme.primary }};
  --iv-blue-dark: {{ company_theme.hover }};
  --iv-sky: {{ company_theme.accent }};
  --bs-primary: {{ company_theme.primary }};
  --bs-primary-rgb: {{ company_theme.primary_rgb }};
  --bs-primary-text-emphasis: {{ company_theme.emphasis }};
  --bs-primary-bg-subtle: {{ company_theme.subtle }};
  --bs-primary-border-subtle: {{ company_theme.subtle_border }};
  --bs-link-color: {{ company_theme.primary }};
  --bs-link-color-rgb: {{ company_theme.primary_rgb }};
  --bs-link-hover-color: {{ company_theme.hover }};
  --bs-link-hover-color-rgb: {{ company_theme.hover_rgb }};
}
.btn-primary {
  --bs-btn-bg: {{ company_theme.primary }}; --bs-btn-border-color: {{ company_theme.primary }}; --bs-btn-color: {{ company_theme.on_primary }};
  --bs-btn-hover-bg: {{ company_theme.hover }}; --bs-btn-hover-border-color: {{ company_theme.hover }}; --bs-btn-hover-color: {{ company_theme.on_primary }};
  --bs-btn-active-bg: {{ company_theme.active }}; --bs-btn-active-border-color: {{ company_theme.active }}; --bs-btn-active-color: {{ company_theme.on_primary }};
  --bs-btn-disabled-bg: {{ company_theme.primary }}; --bs-btn-disabled-border-color: {{ company_theme.primary }};
  --bs-btn-focus-shadow-rgb: {{ company_theme.primary_rgb }};
}
.btn-outline-primary {
  --bs-btn-color: {{ company_theme.primary }}; --bs-btn-border-color: {{ company_theme.primary }};
  --bs-btn-hover-bg: {{ company_theme.primary }}; --bs-btn-hover-border-color: {{ company_theme.primary }}; --bs-btn-hover-color: {{ company_theme.on_primary }};
  --bs-btn-active-bg: {{ company_theme.active }}; --bs-btn-active-border-color: {{ company_theme.active }}; --bs-btn-active-color: {{ company_theme.on_primary }};
  --bs-btn-disabled-color: {{ company_theme.primary }}; --bs-btn-disabled-border-color: {{ company_theme.primary }};
  --bs-btn-focus-shadow-rgb: {{ company_theme.primary_rgb }};
}
.form-control:focus, .form-select:focus, .form-check-input:focus { border-color: {{ company_theme.focus }}; box-shadow: 0 0 0 0.25rem rgba({{ company_theme.primary_rgb }}, 0.2); }
.sidebar .nav-link.active { background: rgba({{ company_theme.accent_rgb }}, 0.16); }
.topbar { border-top: 3px solid {{ company_theme.primary }}; }
{% endif %}{% if company_theme.sidebar %}:root, [data-bs-theme="light"] { --sidebar-bg: {{ company_theme.sidebar }}; --iv-navy: {{ company_theme.sidebar }}; }
{% endif %}</style>{% endif %}
