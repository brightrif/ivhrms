{% extends "web/base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="mb-0">Staff</h1>
  {% if perms.employees.add_employee %}
  <a class="btn btn-primary" href="{% url 'web:employee_create' %}"><i class="bi bi-plus-lg me-1"></i>Add staff member</a>
  {% endif %}
</div>

<form method="get" class="row g-2 mb-3" hx-get="{% url 'web:employee_list' %}" hx-trigger="input delay:300ms"
      hx-target="#results" hx-push-url="true">
  <div class="col-md-5 col-lg-4">
    <div class="input-group">
      <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
      <input type="search" name="q" value="{{ q }}" class="form-control" placeholder="Search name, number or email" autofocus>
    </div>
  </div>
  {% if multi_company %}
  <div class="col-6 col-md-2">
    <select name="company" class="form-select">
      <option value="">All companies</option>
      {% for c in companies %}<option value="{{ c.pk }}"{% if c.pk|stringformat:"s" == company %} selected{% endif %}>{{ c.name }}</option>{% endfor %}
    </select>
  </div>
  {% endif %}
  <div class="col-6 col-md-2">
    <select name="status" class="form-select">
      <option value="">Any status</option>
      {% for value, label in statuses %}<option value="{{ value }}"{% if value == status %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-2">
    <select name="worker_type" class="form-select">
      <option value="">Staff and labor</option>
      {% for value, label in worker_types %}<option value="{{ value }}"{% if value == wtype %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
</form>

<div id="results">{% include "web/staff/_table.html" %}</div>
{% endblock %}
