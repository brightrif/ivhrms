<div class="table-responsive">
  <table class="table align-middle mb-2">
    <thead class="table-light"><tr><th>Company</th><th>Weekly off now</th></tr></thead>
    <tbody>{% for r in weekly_off_rows %}<tr><td>{{ r.company.name }}</td><td><span class="badge text-bg-success">{{ r.now }}</span></td></tr>
    {% empty %}<tr><td colspan="2" class="text-body-secondary">No companies.</td></tr>{% endfor %}</tbody>
  </table>
</div>
{% if perms.scheduling.view_weeklyoffrule %}<a class="btn btn-sm btn-outline-primary" href="{% url 'web:weekly_off' %}">See the history and change it</a>{% endif %}
