<div class="table-responsive">
  <table class="table table-sm align-middle mb-0">
    <thead class="table-light"><tr><th>Company</th><th>Runs projects</th></tr></thead>
    <tbody>
    {% for c in section.extra.project_rows %}
      <tr>
        <td class="fw-medium">{{ c.name }}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch" id="runs-{{ c.pk }}" name="runs-{{ c.pk }}"
                     aria-label="{{ c.name }} runs projects"{% if c.runs_projects %} checked{% endif %}{% if not can_edit %} disabled{% endif %}
                     hx-post="{% url 'web:company_projects_set' c.pk %}" hx-trigger="change"
                     hx-target="#runs-state-{{ c.pk }}" hx-swap="innerHTML">
            </div>
            <span id="runs-state-{{ c.pk }}">{% if c.runs_projects %}<span class="badge text-bg-success">Runs projects</span>{% else %}<span class="badge text-bg-secondary">No projects</span>{% endif %}</span>
          </div>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="text-body-secondary">No companies available.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% if not can_edit %}<div class="small text-body-secondary mt-2">You can see this but not change it.</div>{% endif %}
<script>
  // If saving fails, put the switch back so the page never shows a state that was not saved.
  ["htmx:responseError", "htmx:sendError"].forEach(function (name) {
    document.body.addEventListener(name, function (e) {
      var box = e.target;
      if (box && box.name && box.name.indexOf("runs-") === 0) {
        box.checked = !box.checked;
        alert("Could not save that change. Nothing was changed.");
      }
    });
  });
</script>
