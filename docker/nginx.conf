# nginx in front of the app: it serves the static files itself and passes everything else to gunicorn.
upstream ivhrms_web {
    server web:8000;
}

server {
    listen 80;                       # port 80 INSIDE the nginx container; the host port is set in docker-compose.yml
    server_name _;
    client_max_body_size 25m;        # certificate scans, receipts and other uploads

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {               # uploaded files that are meant to be public. private_media is never served here.
        alias /srv/media/;
    }

    location / {
        proxy_pass http://ivhrms_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
